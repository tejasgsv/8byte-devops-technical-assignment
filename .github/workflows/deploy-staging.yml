name: CD Staging - Build Docker Images, Scan, Push ECR & Deploy

on:
  push:
    branches:
      - main
      - master
      - ci-test
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID || '836960783082' }}
  EKS_CLUSTER_NAME: 8byte-devops-eks
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  docker-build-and-test:
    name: Build Microservice Containers & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Local Microservice Containers
        run: |
          echo "Building microservice container images..."
          SERVICES=("gateway" "frontend" "admin" "user-auth" "catalog" "order-payment" "fulfillment" "shopping" "platform" "inventory")

          for service in "${SERVICES[@]}"; do
            if [ -d "services/$service" ] && [ -f "services/$service/Dockerfile" ]; then
              echo "Building $service..."
              docker build -t "8byte-staging-$service:latest" ./services/$service
            fi
          done

      - name: Container Security Vulnerability Scan (Gateway)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '8byte-staging-gateway:latest'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

  build-and-push-ecr:
    name: Authenticate AWS & Push Images to ECR
    needs: docker-build-and-test
    if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Container Images to ECR Registry
        run: |
          IMAGE_TAG=${{ github.sha }}
          ECR_REGISTRY="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com"
          SERVICES=("gateway" "frontend" "admin" "user-auth" "catalog" "order-payment" "fulfillment" "shopping" "platform" "inventory")

          for service in "${SERVICES[@]}"; do
            if [ -d "services/$service" ] && [ -f "services/$service/Dockerfile" ]; then
              REPO="$ECR_REGISTRY/8byte-devops/$service"
              docker build -t $REPO:$IMAGE_TAG -t $REPO:latest ./services/$service
              docker push $REPO:$IMAGE_TAG
              docker push $REPO:latest
            fi
          done

  deploy-staging:
    name: Deploy Workloads to EKS Staging Namespace
    needs: build-and-push-ecr
    if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy Kubernetes Manifests to Staging Namespace
        run: |
          kubectl create namespace 8byte-staging --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/base/ -n 8byte-staging
          kubectl rollout status deployment/gateway-deployment -n 8byte-staging --timeout=180s || true

  notify:
    name: Slack / Email Notification Gateway
    needs: [docker-build-and-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Notification on Failure
        if: ${{ contains(needs.*.result, 'failure') && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"🚨 *8Byte Staging Deployment Failed!* Commit: `${{ github.sha }}` on branch `${{ github.ref_name }}`"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send Slack Notification on Success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"✅ *8Byte Staging Deployment Successful!* Commit: `${{ github.sha }}` deployed to `8byte-staging`"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }}
