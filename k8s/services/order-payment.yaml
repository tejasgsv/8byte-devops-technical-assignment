apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-payment
  namespace: 8byte
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-payment
  template:
    metadata:
      labels:
        app: order-payment
    spec:
      containers:
        - name: order-payment
          image: 8byte-order-payment:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3002
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: NODE_ENV
            - name: PORT
              value: "3002"

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: 8byte-secrets
                  key: DB_PASSWORD

            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: REDIS_PORT
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: REDIS_URL

            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: RABBITMQ_URL

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: 8byte-secrets
                  key: JWT_SECRET

            - name: STRIPE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: 8byte-secrets
                  key: STRIPE_SECRET_KEY

          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: order-payment
  namespace: 8byte
spec:
  selector:
    app: order-payment
  ports:
    - port: 3002
      targetPort: 3002
  type: ClusterIP
