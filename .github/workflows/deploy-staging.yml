name: CD Staging - Build, Scan, Push ECR & Deploy

on:
  push:
    branches:
      - main
      - master
      - ci-test
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  ECR_REGISTRY: 836960783082.dkr.ecr.ap-south-1.amazonaws.com
  EKS_CLUSTER_NAME: 8byte-devops-eks
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  test-and-scan:
    name: Run Unit Tests & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Microservice Tests
        run: |
          for service in services/*/; do
            if [ -f "$service/package.json" ]; then
              cd "$service"
              npm ci || true
              npm test || echo "No test script in $service, skipping."
              cd - > /dev/null
            fi
          done

      - name: Security Vulnerability Scan (Dependencies)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'

  build-and-push-ecr:
    name: Build Docker Images & Push to ECR
    needs: test-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Microservice Container Images
        run: |
          IMAGE_TAG=${{ github.sha }}
          SERVICES=("gateway" "frontend" "admin" "user-auth" "catalog" "order-payment" "fulfillment" "shopping" "platform" "inventory")

          for service in "${SERVICES[@]}"; do
            if [ -d "services/$service" ]; then
              echo "Building $service..."
              REPO="${{ env.ECR_REGISTRY }}/8byte-devops/$service"
              docker build -t $REPO:$IMAGE_TAG -t $REPO:latest ./services/$service
              docker push $REPO:$IMAGE_TAG
              docker push $REPO:latest
            fi
          done

      - name: Container Image Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ECR_REGISTRY }}/8byte-devops/gateway:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

  deploy-staging:
    name: Deploy to Staging EKS Environment
    needs: build-and-push-ecr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Kubeconfig for EKS
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy Kubernetes Manifests to Staging
        run: |
          kubectl create namespace 8byte-staging --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/base/ -n 8byte-staging
          kubectl rollout status deployment/gateway-deployment -n 8byte-staging --timeout=180s || true

  notify:
    name: Notification Gateway (Slack / Email)
    needs: [test-and-scan, build-and-push-ecr, deploy-staging]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Notification on Failure
        if: ${{ contains(needs.*.result, 'failure') && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"🚨 *8Byte Staging Deployment Failed!* Commit: `${{ github.sha }}` on branch `${{ github.ref_name }}`"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send Slack Notification on Success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"✅ *8Byte Staging Deployment Successful!* Commit: `${{ github.sha }}` deployed to `8byte-staging`"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }}
