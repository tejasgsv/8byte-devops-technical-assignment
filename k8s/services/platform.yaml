apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform
  namespace: 8byte
spec:
  replicas: 1
  selector:
    matchLabels:
      app: platform
  template:
    metadata:
      labels:
        app: platform
    spec:
      containers:
        - name: platform
          image: 8byte-platform:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3005

          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: NODE_ENV

            - name: PORT
              value: "3005"

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: DB_HOST

            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: DB_PORT

            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: DB_NAME

            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: DB_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: 8byte-secrets
                  key: DB_PASSWORD

            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: REDIS_HOST

            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: REDIS_PORT

            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: REDIS_URL

            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: RABBITMQ_URL

            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: 8byte-secrets
                  key: AWS_ACCESS_KEY_ID

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: 8byte-secrets
                  key: AWS_SECRET_ACCESS_KEY

            - name: AWS_REGION
              value: "us-east-1"

            - name: AWS_S3_ENDPOINT
              value: "http://minio:9000"

          readinessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 3005
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: platform
  namespace: 8byte
spec:
  selector:
    app: platform
  ports:
    - port: 3005
      targetPort: 3005
  type: ClusterIP
