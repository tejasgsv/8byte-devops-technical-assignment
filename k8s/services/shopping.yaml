apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping
  namespace: 8byte
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shopping
  template:
    metadata:
      labels:
        app: shopping
    spec:
      containers:
        - name: shopping
          image: 8byte-shopping:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3004
          env:
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: NODE_ENV
            - name: PORT
              value: "3004"

            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: 8byte-secrets
                  key: DB_PASSWORD

            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: REDIS_PORT
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: REDIS_URL

            - name: RABBITMQ_URL
              valueFrom:
                configMapKeyRef:
                  name: 8byte-config
                  key: RABBITMQ_URL

          readinessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 3004
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: shopping
  namespace: 8byte
spec:
  selector:
    app: shopping
  ports:
    - port: 3004
      targetPort: 3004
  type: ClusterIP
