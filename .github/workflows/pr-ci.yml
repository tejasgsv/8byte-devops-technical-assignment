name: Feature Branch & PR CI - Test, Scan & Terraform Plan

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - ci-test
      - 'feature/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  container-build-check:
    name: Parallel Docker Build Check (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, frontend, admin, user-auth, catalog, order-payment, fulfillment, shopping, platform, inventory]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fast Docker Build Check with Layer Cache
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  terraform-lint-security-and-plan:
    name: Terraform Validate, TFLint & Plan Only
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0

      - name: Init TFLint
        run: tflint --init
        working-directory: ./terraform

      - name: Run TFLint Static Analysis
        run: tflint -f compact
        working-directory: ./terraform

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::836960783082:role/GitHubActions-8Byte-Deployment
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform

      - name: Terraform Plan Only (No Apply)
        run: terraform plan -no-color
        working-directory: ./terraform

  terratest-execution:
    name: Run Terratest Infrastructure Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'

      - name: Execute Terratest Go Suite
        run: |
          cd terraform/test
          go mod tidy
          go test -v -timeout 15m
        continue-on-error: true
