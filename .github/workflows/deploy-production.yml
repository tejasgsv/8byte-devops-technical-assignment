name: CD Production - Manual Approval & Promotion

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker Image Tag / Git Commit SHA to deploy to Production'
        required: true
        default: 'latest'

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'ap-south-1' }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID || '836960783082' }}.dkr.ecr.${{ secrets.AWS_REGION || 'ap-south-1' }}.amazonaws.com
  EKS_CLUSTER_NAME: 8byte-devops-eks
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

jobs:
  production-approval-and-deploy:
    name: Production Deployment (Manual Gate Approval Enforced)
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.8byte.ai
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Kubeconfig for EKS
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy Kubernetes Manifests to Production Namespace
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          kubectl create namespace 8byte-prod --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/base/ -n 8byte-prod
          
      - name: Verify Production Deployment Rollout Status
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
        run: |
          kubectl rollout status deployment/gateway-deployment -n 8byte-prod --timeout=300s
          kubectl get pods -n 8byte-prod

      - name: Send Slack Notification on Production Success
        if: success() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"🚀 *8Byte Production Deployment Live!* Tag: `${{ github.event.inputs.image_tag }}` successfully deployed to `8byte-prod`"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send Slack Notification on Production Failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"🚨 *8Byte Production Deployment FAILED!* Tag: `${{ github.event.inputs.image_tag }}` failed during rollout."}' \
            ${{ secrets.SLACK_WEBHOOK_URL }}
