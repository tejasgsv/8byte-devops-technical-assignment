name: PR CI - Parallel Build, Security Scan, TFLint & Terratest

on:
  push:
    branches:
      - main
      - master
      - ci-test
  pull_request:
    branches:
      - main
      - master
      - ci-test
  workflow_dispatch:

jobs:
  parallel-container-build-check:
    name: Parallel Docker Build Check (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, frontend, admin, user-auth, catalog, order-payment, fulfillment, shopping, platform, inventory]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Fast Docker Build Check with Layer Cache
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  dockerfile-linter:
    name: Hadolint Dockerfile Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Hadolint on Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: 'services/*/Dockerfile'
          failure-threshold: error
        continue-on-error: true

  terraform-lint-and-security:
    name: TFLint & Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.0

      - name: Init TFLint
        run: tflint --init
        working-directory: ./terraform

      - name: Run TFLint Analysis
        run: tflint -f compact
        working-directory: ./terraform

      - name: Run Trivy Infrastructure Security Scan (TFSec)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: './terraform'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

  terratest-execution:
    name: Run Terratest Infrastructure Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'

      - name: Execute Terratest Go Suite
        run: |
          cd terraform/test
          go test -v -timeout 15m
        continue-on-error: true
