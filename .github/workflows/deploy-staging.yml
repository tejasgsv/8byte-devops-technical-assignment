name: CD Staging - Parallel Build, Layer Cache & Fast Deploy

on:
  push:
    branches:
      - main
      - master
      - ci-test
  workflow_dispatch:

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: '836960783082'
  OIDC_ROLE_ARN: arn:aws:iam::836960783082:role/GitHubActions-8Byte-Deployment
  EKS_CLUSTER_NAME: 8byte-devops-eks
  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

permissions:
  id-token: write
  contents: read

jobs:
  parallel-build-and-push-ecr:
    name: Parallel Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, frontend, admin, user-auth, catalog, order-payment, fulfillment, shopping, platform, inventory]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx (Fast Caching Engine)
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Image with GitHub Layer Cache
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: true
          tags: |
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/8byte-devops/${{ matrix.service }}:${{ github.sha }}
            ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/8byte-devops/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  container-security-scan:
    name: Fast Container Security Scan (Trivy)
    needs: parallel-build-and-push-ecr
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Fast Security Scan on Gateway Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/8byte-devops/gateway:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          severity: 'HIGH,CRITICAL'

  deploy-staging:
    name: Fast EKS Staging Deployment
    needs: parallel-build-and-push-ecr
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Kubeconfig for EKS
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Deploy Kubernetes Manifests to Staging
        run: |
          kubectl create namespace 8byte-staging --dry-run=client -o yaml | kubectl apply -f -
          kubectl apply -f k8s/base/ -n 8byte-staging
          kubectl rollout status deployment/gateway-deployment -n 8byte-staging --timeout=120s || true

  notify:
    name: Slack / Email Notification Gateway
    needs: [parallel-build-and-push-ecr, deploy-staging]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Notification on Failure
        if: ${{ contains(needs.*.result, 'failure') && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"🚨 *8Byte Staging Deployment Failed!* Commit: `${{ github.sha }}`"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Send Slack Notification on Success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && env.SLACK_WEBHOOK_URL != '' }}
        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"✅ *8Byte Staging Deployment Successful!* Commit: `${{ github.sha }}` deployed to `8byte-staging`"}' \
            ${{ secrets.SLACK_WEBHOOK_URL }}
