worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    resolver 127.0.0.11 ipv6=off;

    upstream user-communication-service {
        server user-auth:3000;
    }

    upstream catalog-service {
        server catalog:3001;
    }

    upstream inventory-service {
        server inventory:3009;
    }

    upstream shopping-service {
        server shopping:3004;
    }

    upstream order-payment-service {
        server order-payment:3002;
    }

    upstream fulfillment-service {
        server fulfillment:3003;
    }

    upstream platform-insights-service {
        server platform:3005;
    }

    upstream frontend {
        server frontend:80;
    }

    upstream admin {
        server admin:80;
    }

    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

    server {
        listen 80;
        server_name _;

        location /api/auth/health {
            proxy_pass http://user-communication-service/health;
            include /etc/nginx/proxy_params;
        }

        location /api/auth {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://user-communication-service;
            include /etc/nginx/proxy_params;
        }

        location /api/users {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://user-communication-service;
            include /etc/nginx/proxy_params;
        }

        location /api/notifications {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://user-communication-service;
            include /etc/nginx/proxy_params;
        }

        location /api/products {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://catalog-service;
            include /etc/nginx/proxy_params;
        }

        location /api/categories {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://catalog-service;
            include /etc/nginx/proxy_params;
        }

        location /api/reviews {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://catalog-service;
            include /etc/nginx/proxy_params;
        }

        location /api/search {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://catalog-service;
            include /etc/nginx/proxy_params;
        }

        location /api/recommendations {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://catalog-service;
            include /etc/nginx/proxy_params;
        }

        location /api/inventory {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://inventory-service;
            include /etc/nginx/proxy_params;
        }

        location /api/cart {
            limit_req zone=api burst=50 nodelay;
            proxy_pass http://shopping-service;
            include /etc/nginx/proxy_params;
        }

        location /api/wishlist {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://shopping-service;
            include /etc/nginx/proxy_params;
        }

        location /api/orders {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://order-payment-service;
            include /etc/nginx/proxy_params;
        }

        location /api/payments {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://order-payment-service;
            include /etc/nginx/proxy_params;
        }

        location /api/shipping {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://fulfillment-service;
            include /etc/nginx/proxy_params;
        }

        location /api/coupons {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://fulfillment-service;
            include /etc/nginx/proxy_params;
        }

        location /api/analytics {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://platform-insights-service;
            include /etc/nginx/proxy_params;
        }

        location /api/files {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://platform-insights-service;
            include /etc/nginx/proxy_params;
        }

        location /api/reports {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://platform-insights-service;
            include /etc/nginx/proxy_params;
        }

        location /api/audit {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://platform-insights-service;
            include /etc/nginx/proxy_params;
        }

        location /api/health {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://user-communication-service/health;
            include /etc/nginx/proxy_params;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /admin {
            proxy_pass http://admin;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}


